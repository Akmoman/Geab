<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام توزيع الاحتياط المدرسي - مدرسة بلال بن رباح</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f8fafc;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Print Styles */
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; -webkit-print-color-adjust: exact; }
            .print-container { width: 100%; max-width: none; margin: 0; padding: 0; }
            @page { size: A4; margin: 1cm; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const IconUserX = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/>
            </svg>
        );
        const IconClock = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
        );
        const IconCheckCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
        );
        const IconUsers = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        );
        const IconPrinter = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
            </svg>
        );
        const IconBuilding = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>
            </svg>
        );
        const IconBriefcase = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
            </svg>
        );
        // --- Data ---
        const INITIAL_TEACHERS = [
            {
                id: 1,
                name: "أ. عبدالله خلف مراش الرواحي",
                schedule: {
                "الأحد": [null, null, null, "12/4", "12/5", "11/3", "11/4", null],
                "الاثنين": [null, null, null, "11/2", "11/4", null, "12/4", "12/5"],
                "الثلاثاء": [null, null, null, null, "12/4", "12/5", null, "11/2"],
                "الأربعاء": [null, null, null, "11/2", "11/4", null, null, "12/4"],
                "الخميس": [null, null, "12/4", "12/5", "11/3", "11/2", "11/4", null],
                }
            },
            {
                id: 2,
                name: "أ. سالم هلال سالم السيابي",
                schedule: {
                "الأحد": [null, null, "9/4", "9/3", null, null, "6/2", "6/1"],
                "الاثنين": [null, null, "6/4", "6/1", "6/3", null, "6/4", null],
                "الثلاثاء": [null, null, "6/3", "6/1", "6/2", null, "6/4", null],
                "الأربعاء": ["6/4", null, "6/2", "9/4", null, "6/1", null, "6/3"],
                "الخميس": ["6/1", "9/3", null, "6/3", null, "6/2", "6/4", null],
                }
            },
            {
                id: 3,
                name: "أ. حمد مرهون سليمان الهشامي",
                schedule: {
                "الأحد": [null, "8/1", "8/4", null, "11/1", "8/2", null, "8/3"],
                "الاثنين": [null, "8/2", null, null, "8/1", "8/3", null, "11/2"],
                "الثلاثاء": [null, "8/3", null, "8/1", null, "8/4", "11/2", null],
                "الأربعاء": [null, "8/3", "11/2", "8/2", null, "11/1", "8/4", null],
                "الخميس": [null, null, "11/1", "8/1", null, null, "8/4", "8/2"],
                }
            },
            {
                id: 4,
                name: "أ. يوسف سويد خنفر العبري",
                schedule: {
                "الأحد": [null, null, "12/1", null, "12/3", null, null, "10/2"],
                "الاثنين": [null, null, null, "10/2", "10/3", null, "12/4", "12/1"],
                "الثلاثاء": [null, "12/2", null, "12/4", null, "10/3", "10/1", null],
                "الأربعاء": ["10/1", null, null, null, "12/1", "12/3", null, "12/2"],
                "الخميس": [null, null, null, "12/1", null, "12/4", "12/3", null],
                }
            },
            {
                id: 5,
                name: "أ. محمود مصطفى اسماعيل بدران",
                schedule: {
                "الأحد": ["9/2", null, "5/2", null, null, null, "5/4", "5/3"],
                "الاثنين": [null, null, "9/1", "5/1", null, null, "5/4", "5/2"],
                "الثلاثاء": ["5/1", "9/2", null, "5/2", null, "5/3", null, null],
                "الأربعاء": ["5/3", null, null, "5/4", null, "9/1", "9/1", null],
                "الخميس": ["5/4", "5/1", null, "5/3", null, "5/2", null, null],
                }
            },
            {
                id: 6,
                name: "أ. محمد المسعودي",
                schedule: {
                "الأحد": ["10/2", "7/1", null, "7/4", null, "7/3", "10/1", null],
                "الاثنين": [null, "10/3", "7/3", null, null, "10/2", "7/2", null],
                "الثلاثاء": ["10/1", "10/3", null, null, "7/4", null, "7/2", "7/1"],
                "الأربعاء": ["7/3", null, "10/4", "7/2", null, "7/1", "7/4", null],
                "الخميس": ["7/3", null, "7/2", null, "10/4", null, "7/4", "7/1"],
                }
            }
        ];

        const DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس"];
        const PERIODS = [1, 2, 3, 4, 5, 6, 7, 8];

        function App() {
            const [selectedDay, setSelectedDay] = useState("الأحد");
            const [selectedPeriod, setSelectedPeriod] = useState(1);
            const [absentTeacherId, setAbsentTeacherId] = useState("");
            const [assignments, setAssignments] = useState([]); 

            // استرجاع كائن المعلم الغائب
            const absentTeacher = useMemo(() => 
                INITIAL_TEACHERS.find(t => t.id === parseInt(absentTeacherId)), 
                [absentTeacherId]
            );

            const getDailyLoad = (teacher, day) => {
                return teacher.schedule[day].filter(p => p !== null).length;
            };

            const getAssignedReserveCount = (teacherId, day) => {
                return assignments.filter(a => a.teacherId === teacherId && a.day === day).length;
            };

            const availableTeachers = useMemo(() => {
                let available = INITIAL_TEACHERS.filter(teacher => {
                if (absentTeacherId && teacher.id === parseInt(absentTeacherId)) return false;
                
                const isFreeOriginal = teacher.schedule[selectedDay][selectedPeriod - 1] === null;
                
                const isBookedReserve = assignments.some(
                    a => a.teacherId === teacher.id && a.day === selectedDay && a.period === selectedPeriod
                );

                return isFreeOriginal && !isBookedReserve;
                });

                return available.sort((a, b) => {
                const loadA = getDailyLoad(a, selectedDay) + getAssignedReserveCount(a.id, selectedDay);
                const loadB = getDailyLoad(b, selectedDay) + getAssignedReserveCount(b.id, selectedDay);
                return loadA - loadB;
                });
            }, [selectedDay, selectedPeriod, absentTeacherId, assignments]);

            // دالة للتحقق إذا كانت الحصة مغطاة بالفعل
            const isPeriodCovered = (period) => {
                return assignments.some(a => 
                a.day === selectedDay && 
                a.period === period && 
                (absentTeacher ? a.absentTeacherName === absentTeacher.name : true)
                );
            };

            const assignReserve = (teacher, isAdmin = false) => {
                const absentTeacherName = absentTeacher ? absentTeacher.name : "غير محدد";
                const classToCover = absentTeacher ? absentTeacher.schedule[selectedDay][selectedPeriod - 1] : "احتياط";

                const newAssignment = {
                id: Date.now(),
                teacherId: isAdmin ? 'ADMIN' : teacher.id,
                teacherName: isAdmin ? "الإدارة المدرسية" : teacher.name,
                day: selectedDay,
                period: selectedPeriod,
                absentTeacherName: absentTeacherName,
                coveredClass: classToCover,
                isAdmin: isAdmin
                };
                setAssignments([...assignments, newAssignment]);
            };

            const removeAssignment = (id) => {
                setAssignments(assignments.filter(a => a.id !== id));
            };

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans" dir="rtl">
                
                {/* Print Header (Visible only when printing) */}
                <div className="print-only p-8 text-center border-b-2 border-black mb-8">
                    <h1 className="text-3xl font-bold mb-2">كشف توزيع حصص الاحتياط</h1>
                    <div className="flex justify-between mt-4 px-10 text-lg">
                    <p><strong>اليوم:</strong> {selectedDay}</p>
                    <p><strong>التاريخ:</strong> ....................</p>
                    </div>
                </div>

                {/* Print Table (Visible only when printing) */}
                <div className="print-only px-8">
                    <table className="w-full border-collapse border border-gray-400 text-right">
                    <thead>
                        <tr className="bg-gray-100">
                        <th className="border border-gray-400 p-3">الحصة</th>
                        <th className="border border-gray-400 p-3">المعلم الغائب</th>
                        <th className="border border-gray-400 p-3">الفصل</th>
                        <th className="border border-gray-400 p-3">المعلم البديل / الإدارة</th>
                        <th className="border border-gray-400 p-3">التوقيع</th>
                        </tr>
                    </thead>
                    <tbody>
                        {assignments.length > 0 ? assignments.sort((a,b) => a.period - b.period).map(assign => (
                        <tr key={assign.id}>
                            <td className="border border-gray-400 p-3 text-center font-bold">{assign.period}</td>
                            <td className="border border-gray-400 p-3">{assign.absentTeacherName}</td>
                            <td className="border border-gray-400 p-3 text-center" dir="ltr">{assign.coveredClass}</td>
                            <td className="border border-gray-400 p-3 font-bold">
                            {assign.isAdmin ? "⚠️ الإدارة المدرسية" : assign.teacherName}
                            </td>
                            <td className="border border-gray-400 p-3"></td>
                        </tr>
                        )) : (
                        <tr><td colSpan="5" className="p-4 text-center">لا توجد تكليفات</td></tr>
                        )}
                    </tbody>
                    </table>
                    <div className="mt-12 flex justify-between px-10">
                    <p>مدير المدرسة: ....................</p>
                    <p>المشرف الإداري: ....................</p>
                    </div>
                </div>

                {/* Main App Container (Hidden when printing) */}
                <div className="max-w-6xl mx-auto no-print print-container">
                    
                    {/* Header */}
                    <div className="bg-white rounded-2xl shadow-sm p-6 mb-8 border-b-4 border-blue-600 flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <h1 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                        <IconUsers className="w-8 h-8 text-blue-600" />
                        نظام توزيع الاحتياط المدرسي
                        </h1>
                        <p className="text-gray-500 mt-2">مدرسة بلال بن رباح (5-12)</p>
                    </div>
                    <div className="flex gap-3">
                        <button 
                        onClick={handlePrint}
                        className="bg-gray-800 hover:bg-gray-900 text-white px-6 py-2.5 rounded-lg flex items-center gap-2 font-bold shadow-lg transition-all active:scale-95"
                        >
                        <IconPrinter className="w-5 h-5" />
                        طباعة التقرير
                        </button>
                    </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    
                    {/* Controls Section (Left Side) */}
                    <div className="lg:col-span-4 space-y-6">
                        
                        {/* Step 1 */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <IconUserX className="w-5 h-5 text-red-500" />
                            1. بيانات الغياب
                        </h2>
                        <div className="space-y-4">
                            <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">اليوم</label>
                            <select 
                                value={selectedDay} 
                                onChange={(e) => setSelectedDay(e.target.value)}
                                className="w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-blue-500"
                            >
                                {DAYS.map(day => <option key={day} value={day}>{day}</option>)}
                            </select>
                            </div>
                            <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">المعلم الغائب</label>
                            <select 
                                value={absentTeacherId} 
                                onChange={(e) => setAbsentTeacherId(e.target.value)}
                                className="w-full rounded-lg border-gray-300 border p-2.5 focus:ring-2 focus:ring-red-500 bg-red-50"
                            >
                                <option value="">-- اختر المعلم --</option>
                                {INITIAL_TEACHERS.map(t => (
                                <option key={t.id} value={t.id}>{t.name}</option>
                                ))}
                            </select>
                            </div>
                        </div>
                        </div>

                        {/* Step 2 */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                            <IconClock className="w-5 h-5 text-blue-500" />
                            2. اختر الحصة لتغطيتها
                        </h2>

                        {absentTeacher ? (
                            <div className="space-y-3">
                            <div className="grid grid-cols-2 gap-2">
                                {PERIODS.map(p => {
                                const classInfo = absentTeacher.schedule[selectedDay][p-1];
                                const isClass = classInfo !== null;
                                const isCovered = isPeriodCovered(p);
                                const isSelected = selectedPeriod === p;

                                return (
                                    <button
                                    key={p}
                                    onClick={() => setSelectedPeriod(p)}
                                    disabled={!isClass}
                                    className={`
                                        relative p-3 rounded-lg text-sm border transition-all flex flex-col items-center justify-center min-h-[70px]
                                        ${!isClass ? 'bg-gray-50 border-gray-100 opacity-50 cursor-not-allowed' : ''}
                                        ${isClass && !isSelected && !isCovered ? 'bg-white border-red-200 hover:bg-red-50 hover:border-red-300' : ''}
                                        ${isClass && isSelected ? 'bg-blue-600 border-blue-600 text-white shadow-md z-10' : ''}
                                        ${isCovered && !isSelected ? 'bg-green-50 border-green-200 opacity-80' : ''}
                                    `}
                                    >
                                    <span className={`font-bold text-xs absolute top-1 right-2 ${isSelected ? 'text-blue-200' : 'text-gray-400'}`}>ح {p}</span>
                                    {isClass ? (
                                        <React.Fragment>
                                        <span className={`font-bold text-lg mt-1 ${isSelected ? 'text-white' : 'text-gray-800'}`}>{classInfo}</span>
                                        {isCovered ? (
                                            <span className="flex items-center gap-1 text-[10px] text-green-600 bg-green-100 px-1.5 py-0.5 rounded-full mt-1 font-bold">
                                            <IconCheckCircle className="w-3 h-3" /> مغطاة
                                            </span>
                                        ) : (
                                            <span className={`flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-full mt-1 ${isSelected ? 'text-blue-100 bg-blue-700' : 'text-red-500 bg-red-50'}`}>
                                            ⏳ مطلوب
                                            </span>
                                        )}
                                        </React.Fragment>
                                    ) : (
                                        <span className="text-xs text-gray-300 mt-2">-</span>
                                    )}
                                    </button>
                                );
                                })}
                            </div>
                            </div>
                        ) : (
                            <div className="text-center py-6 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                            <p className="text-gray-500 text-sm">يرجى تحديد المعلم الغائب أولاً</p>
                            </div>
                        )}
                        </div>
                        
                        {/* Assignments Summary Card */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                <IconCheckCircle className="w-5 h-5 text-green-500" />
                                السجل ({assignments.length})
                            </h2>
                            {assignments.length > 0 && (
                                <button onClick={() => setAssignments([])} className="text-xs text-red-500 hover:underline">
                                مسح الكل
                                </button>
                            )}
                        </div>
                        {assignments.length === 0 && <p className="text-sm text-gray-400 text-center">القائمة فارغة</p>}
                        <ul className="space-y-2">
                            {assignments.map(a => (
                            <li key={a.id} className="flex justify-between items-center text-sm p-2 bg-gray-50 rounded border border-gray-100">
                                <span className={a.isAdmin ? "text-purple-700 font-bold" : ""}>
                                    {a.isAdmin ? "⚠️ الإدارة" : a.teacherName} (ح{a.period})
                                </span>
                                <button onClick={() => removeAssignment(a.id)} className="text-red-400 hover:text-red-600"><IconUserX className="w-4 h-4" /></button>
                            </li>
                            ))}
                        </ul>
                        </div>

                    </div>

                    {/* Results Section (Right Side) */}
                    <div className="lg:col-span-8">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                        <div>
                            <h2 className="text-xl font-bold text-gray-800">
                            البدلاء المقترحون
                            </h2>
                            <div className="text-sm text-gray-500 mt-1">
                            {isPeriodCovered(selectedPeriod) ? (
                                <span className="text-green-600 font-bold flex items-center gap-1">
                                <IconCheckCircle className="w-4 h-4" /> تم تغطية هذه الحصة مسبقاً
                                </span>
                            ) : (
                                <span>يرجى اختيار معلم لتغطية الحصة</span>
                            )}
                            </div>
                        </div>
                        </div>

                        <div className="space-y-4">
                        {/* Management Option */}
                        <div className={`
                            rounded-xl p-4 border transition-all flex items-center justify-between
                            ${availableTeachers.length === 0 ? 'bg-purple-50 border-purple-200 shadow-md order-first' : 'bg-white border-gray-200 opacity-80 hover:opacity-100 order-last'}
                        `}>
                            <div className="flex items-center gap-4">
                            <div className={`p-3 rounded-full ${availableTeachers.length === 0 ? 'bg-purple-100 text-purple-600' : 'bg-gray-100 text-gray-500'}`}>
                                <IconBuilding className="w-6 h-6" />
                            </div>
                            <div>
                                <h3 className="font-bold text-gray-800">تحويل للإدارة المدرسية</h3>
                                <p className="text-xs text-gray-500">استخدام هذا الخيار عند عدم توفر معلمين أو لدمج الفصول</p>
                            </div>
                            </div>
                            <button 
                            onClick={() => assignReserve(null, true)}
                            disabled={isPeriodCovered(selectedPeriod)}
                            className={`
                                px-6 py-2 rounded-lg text-sm font-bold flex items-center gap-2
                                ${isPeriodCovered(selectedPeriod) ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-purple-600 hover:bg-purple-700 text-white'}
                            `}
                            >
                            <IconBriefcase className="w-4 h-4" />
                            إحالة للإدارة
                            </button>
                        </div>

                        {/* Teachers List */}
                        {availableTeachers.map((teacher, index) => {
                            const currentLoad = getDailyLoad(teacher, selectedDay);
                            const reserveLoad = getAssignedReserveCount(teacher.id, selectedDay);
                            const isCovered = isPeriodCovered(selectedPeriod);
                            
                            return (
                            <div key={teacher.id} className={`bg-white rounded-xl p-5 shadow-sm border border-gray-200 hover:shadow-md transition-shadow relative overflow-hidden ${isCovered ? 'opacity-50' : ''}`}>
                                {index === 0 && !isCovered && availableTeachers.length > 0 && (
                                <div className="absolute top-0 left-0 bg-yellow-400 text-white text-xs px-2 py-1 rounded-br-lg font-bold shadow-sm">
                                    الأقل نصاباً
                                </div>
                                )}
                                
                                <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">
                                {/* Teacher Info */}
                                <div className="flex-1">
                                    <h3 className="font-bold text-gray-800 text-lg flex items-center gap-2">
                                    {teacher.name}
                                    </h3>
                                    <div className="flex items-center gap-4 mt-2">
                                        <div className="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded border border-blue-100">
                                        نصاب اليوم: <b>{currentLoad}</b>
                                        </div>
                                        {reserveLoad > 0 && (
                                        <div className="text-xs bg-orange-50 text-orange-700 px-2 py-1 rounded border border-orange-100">
                                            احتياط سابق: <b>{reserveLoad}</b>
                                        </div>
                                        )}
                                    </div>
                                    {/* Mini Schedule Visualization */}
                                    <div className="flex gap-1 mt-3">
                                    {teacher.schedule[selectedDay].map((p, i) => (
                                        <div 
                                        key={i} 
                                        className={`
                                            w-8 h-1 rounded-full 
                                            ${i === selectedPeriod - 1 ? 'bg-green-500 h-2' : (p ? 'bg-gray-300' : 'bg-gray-100')}
                                        `}
                                        title={`الحصة ${i+1}: ${p || 'فراغ'}`}
                                        />
                                    ))}
                                    </div>
                                </div>

                                {/* Action Button */}
                                <div>
                                    <button 
                                    onClick={() => assignReserve(teacher)}
                                    disabled={isCovered}
                                    className={`
                                        min-w-[140px] py-2.5 rounded-lg flex items-center justify-center gap-2 transition-colors text-sm font-medium
                                        ${isCovered 
                                        ? 'bg-gray-100 text-gray-400 cursor-not-allowed' 
                                        : 'bg-slate-800 hover:bg-slate-700 text-white shadow-sm active:scale-95'}
                                    `}
                                    >
                                    <IconClock className="w-4 h-4" />
                                    {isCovered ? 'تم التعيين' : 'إسناد المعلم'}
                                    </button>
                                </div>
                                </div>
                            </div>
                            );
                        })}

                        {availableTeachers.length === 0 && (
                            <div className="text-center py-8">
                                <p className="text-gray-400 text-sm mb-2">لا يوجد معلمين متاحين لهذه الحصة</p>
                                <p className="text-xs text-gray-300">استخدم خيار "الإدارة المدرسية" في الأعلى</p>
                            </div>
                        )}
                        </div>
                    </div>

                    </div>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
